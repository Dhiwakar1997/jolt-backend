[project]
name = "jolt-backend"
version = "0.3.0"
description = "Jolt backend — thin MCP tool surface + REST API over Cosmos/Blob/Key Vault"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["jolt*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, import order.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["jolt"]
