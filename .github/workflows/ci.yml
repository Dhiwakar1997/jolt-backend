name: CI

on:
  push:
  pull_request:
  # Reused by deploy-dev.yml so a deploy only happens after the checks pass.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter as the Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps .

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: python -m pytest -q

      - name: Contract is up to date
        run: python scripts/export_contract.py --check

  audit:
    # BE-10 security review (docs/SECURITY.md S-08, S-28): known vulnerabilities
    # in the pinned runtime dependencies fail the build (and so the deploy).
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
